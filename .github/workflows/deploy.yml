name: Deploy production

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run db:generate
      - name: Validate production secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$DATABASE_URL"
      - name: Apply PostgreSQL migrations
        run: bun run db:deploy
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply scouty-edge --remote --config apps/api/wrangler.jsonc
      - name: Deploy API Worker
        run: bun run deploy:api
      - name: Build web
        run: bun run --filter '@scouty/web' build
      - name: Deploy Pages
        run: >-
          bunx wrangler pages deploy apps/web/dist
          --project-name scouty-web
          --branch main
          --commit-hash ${{ github.event.workflow_run.head_sha || github.sha }}

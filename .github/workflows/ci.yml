name: CI / CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scouty
          POSTGRES_PASSWORD: scouty
          POSTGRES_USER: scouty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scouty -d scouty"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://scouty:scouty@localhost:5432/scouty?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run db:generate
      - run: bun run db:deploy
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Build PDF processing container
        run: docker build --file apps/api/container/Dockerfile apps/api/container

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: d09b11497e0618d6dceff0559855a7b2
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run db:generate
      - name: Validate production secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing production secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$DATABASE_URL" || { echo "::error::Missing production secret DATABASE_URL"; exit 1; }
      - name: Validate Worker runtime secrets
        shell: bash
        run: |
          worker_secrets="$(bunx wrangler secret list --name scouty-api --config apps/api/wrangler.jsonc)"
          for required in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET OAUTH_STATE_SECRET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if ! jq -e --arg required "$required" 'any(.[]; .name == $required)' <<<"$worker_secrets" >/dev/null; then
              echo "::error::Missing scouty-api Worker secret $required"
              exit 1
            fi
          done
      - name: Apply PostgreSQL migrations
        run: bun run db:deploy
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply scouty-edge --remote --config apps/api/wrangler.jsonc
      - name: Deploy API Worker
        run: bun run deploy:api
      - name: Build web
        run: bun run --filter '@scouty/web' build
      - name: Deploy Pages
        run: >-
          bunx wrangler pages deploy apps/web/dist
          --project-name scouty-web
          --branch main
          --commit-hash ${{ github.sha }}
      - name: Verify production
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://api.greeney.life/ready
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://api.greeney.life/docs >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://greeney.life >/dev/null

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scouty
      POSTGRES_PASSWORD: scouty
      POSTGRES_USER: scouty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouty -d scouty"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - scouty-postgres-data:/var/lib/postgresql/data

volumes:
  scouty-postgres-data:
